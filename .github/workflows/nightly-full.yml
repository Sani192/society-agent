name: Nightly Full Test Suite

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  full-tests:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg2://society_user:society_pass@localhost:5432/society_db
      REDIS_URL: redis://localhost:6379/0
      QUEUE_URL: amqp://guest:guest@localhost:5672/
      OBJECT_STORE_ENDPOINT: http://localhost:9000
      OBJECT_STORE_ACCESS_KEY: minioadmin
      OBJECT_STORE_SECRET_KEY: minioadmin
      OBJECT_STORE_BUCKET: society-agent-ci
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Start containerized test dependencies
        run: docker compose -f ci/docker-compose.test-deps.yml -p nightly-${{ github.run_id }} up -d

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Reset and seed deterministic DB state
        run: python scripts/ci/reset_test_state.py

      - name: Run full pytest suite
        run: pytest -q --junitxml=artifacts/junit/full.xml

      - name: Run API contract drift checks
        run: pytest -q tests/test_contract_schema_ci.py --junitxml=artifacts/junit/contract-drift.xml

      - name: Collect dependency logs on failure
        if: failure()
        run: |
          mkdir -p artifacts/logs
          docker compose -f ci/docker-compose.test-deps.yml -p nightly-${{ github.run_id }} logs --no-color > artifacts/logs/dependency-services.log

      - name: Upload failure artifacts (logs/traces/screenshots)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-failure-artifacts-${{ github.run_id }}
          path: |
            artifacts/
            test-results/
            playwright-report/
            **/*.png
            **/*.trace

      - name: Teardown ephemeral dependencies
        if: always()
        run: docker compose -f ci/docker-compose.test-deps.yml -p nightly-${{ github.run_id }} down -v
