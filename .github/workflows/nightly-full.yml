name: Nightly/Release Full E2E Regression

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches:
      - 'release/**'

env:
  DATABASE_URL: postgresql+psycopg2://society_user:society_pass@localhost:5432/society_db
  REDIS_URL: redis://localhost:6379/0
  QUEUE_URL: amqp://guest:guest@localhost:5672/
  OBJECT_STORE_ENDPOINT: http://localhost:9000
  OBJECT_STORE_ACCESS_KEY: minioadmin
  OBJECT_STORE_SECRET_KEY: minioadmin
  OBJECT_STORE_BUCKET: society-agent-ci
  PYTHONUNBUFFERED: "1"

jobs:
  full-e2e-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start containerized test dependencies
        run: docker compose -f ci/docker-compose.test-deps.yml -p nightly-${{ github.run_id }} up -d

      - name: Wait for dependency health checks
        run: |
          set -euo pipefail
          mkdir -p artifacts/logs
          COMPOSE_ARGS="-f ci/docker-compose.test-deps.yml -p nightly-${{ github.run_id }}"
          SERVICES=(postgres redis rabbitmq minio)
          TIMEOUT_SECONDS=180
          POLL_SECONDS=5
          START_TIME=$(date +%s)

          while true; do
            echo "Current dependency status:"
            docker compose ${COMPOSE_ARGS} ps || true

            all_healthy=true
            for service in "${SERVICES[@]}"; do
              container_id=$(docker compose ${COMPOSE_ARGS} ps -q "${service}")
              if [ -z "${container_id}" ]; then
                echo "Service ${service} is not running."
                all_healthy=false
                continue
              fi

              health_status=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "${container_id}" 2>/dev/null || echo "unknown")
              echo "${service}: ${health_status}"
              if [ "${health_status}" != "healthy" ]; then
                all_healthy=false
              fi
            done

            if [ "${all_healthy}" = true ]; then
              echo "All dependencies are healthy."
              break
            fi

            elapsed=$(( $(date +%s) - START_TIME ))
            if [ "${elapsed}" -ge "${TIMEOUT_SECONDS}" ]; then
              echo "Timed out waiting for dependencies to become healthy after ${TIMEOUT_SECONDS}s."
              docker compose ${COMPOSE_ARGS} ps | tee artifacts/logs/dependency-health-ps.txt
              for service in "${SERVICES[@]}"; do
                container_id=$(docker compose ${COMPOSE_ARGS} ps -q "${service}")
                if [ -n "${container_id}" ]; then
                  docker inspect "${container_id}" > "artifacts/logs/dependency-health-${service}.json"
                fi
              done
              docker compose ${COMPOSE_ARGS} logs --no-color > artifacts/logs/dependency-services.log
              exit 1
            fi

            sleep "${POLL_SECONDS}"
          done

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-rerunfailures

      - name: Reset and seed deterministic DB state
        run: python scripts/ci/reset_test_state.py

      - name: Run full E2E regression suite
        run: pytest --reruns 1 -q tests/e2e --junitxml=artifacts/junit/full-e2e.xml

      - name: Run contract drift guard
        run: pytest -q tests/test_contract_schema_ci.py --junitxml=artifacts/junit/contract-drift.xml

      - name: Build reliability dashboard + enforce flaky threshold
        run: |
          python scripts/ci/reliability_dashboard.py \
            --junit artifacts/junit/full-e2e.xml artifacts/junit/contract-drift.xml \
            --output-json artifacts/reliability/dashboard.json \
            --output-md artifacts/reliability/dashboard.md \
            --flaky-threshold 2
          cat artifacts/reliability/dashboard.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reliability artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reliability-dashboard-nightly-${{ github.run_id }}
          path: |
            artifacts/junit/
            artifacts/reliability/

      - name: Collect dependency logs on failure
        if: failure()
        run: |
          mkdir -p artifacts/logs
          docker compose -f ci/docker-compose.test-deps.yml -p nightly-${{ github.run_id }} logs --no-color > artifacts/logs/dependency-services.log
          docker compose -f ci/docker-compose.test-deps.yml -p nightly-${{ github.run_id }} ps > artifacts/logs/dependency-health-ps.txt
          for service in postgres redis rabbitmq minio; do
            container_id=$(docker compose -f ci/docker-compose.test-deps.yml -p nightly-${{ github.run_id }} ps -q "${service}")
            if [ -n "${container_id}" ]; then
              docker inspect "${container_id}" > "artifacts/logs/dependency-health-${service}.json"
            fi
          done

      - name: Upload dependency diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-diagnostics-nightly-${{ github.run_id }}
          path: artifacts/logs/

      - name: Teardown ephemeral dependencies
        if: always()
        run: docker compose -f ci/docker-compose.test-deps.yml -p nightly-${{ github.run_id }} down -v
