name: PR Reliability Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - "**"
  workflow_dispatch:

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  MYPY_BASELINE_TARGET_DATE: "2026-06-30"

jobs:
  stage-1-fast-feedback:
    name: Stage 1 - Lint, type checks, fast unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and quality tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy
          pip install pytest-testmon || echo "pytest-testmon install failed; using pytest fallback mode"

      - name: Restore test impact cache (.testmondata)
        uses: actions/cache@v4
        with:
          path: .testmondata
          key: testmon-stage1-${{ github.base_ref || github.ref_name }}-${{ hashFiles('requirements.txt', 'pytest.ini') }}
          restore-keys: |
            testmon-stage1-${{ github.base_ref || github.ref_name }}-

      - name: Lint
        run: ruff check app tests scripts

      - name: Type checks (repo-wide with baseline guard)
        run: python scripts/ci/mypy_regression_guard.py app scripts

      - name: Enforce mypy baseline sunset milestone
        run: |
          set -euo pipefail
          if [ ! -f ci/mypy-baseline.txt ]; then
            exit 0
          fi
          baseline_count=$(rg -cve '^\s*$' ci/mypy-baseline.txt || true)
          if [ "$baseline_count" -eq 0 ]; then
            exit 0
          fi
          today=$(date -u +%F)
          if [ "$today" \> "${MYPY_BASELINE_TARGET_DATE}" ]; then
            echo "mypy baseline must be empty after ${MYPY_BASELINE_TARGET_DATE}, found ${baseline_count} entries."
            exit 1
          fi
          echo "mypy baseline entries remaining (${baseline_count}); deadline is ${MYPY_BASELINE_TARGET_DATE}."

      - name: Enforce integration/endpoint marker policy
        run: python scripts/ci/check_test_markers.py

      - name: Run fast unit tests with impact selection
        run: |
          mkdir -p artifacts/junit artifacts/coverage
          if pytest --help | grep -q -- "--testmon"; then
            pytest --testmon -q -m "not integration and not endpoint and not smoke" --junitxml=artifacts/junit/stage1-unit.xml --cov-fail-under=20
          else
            echo "pytest-testmon not available; running without impact selection"
            pytest -q -m "not integration and not endpoint and not smoke" --junitxml=artifacts/junit/stage1-unit.xml --cov-fail-under=20
          fi
          if [ -f coverage.xml ]; then
            cp coverage.xml artifacts/coverage/stage1-coverage.xml
          fi

      - name: Ensure Stage 1 test artifacts exist
        if: always()
        run: |
          mkdir -p artifacts/junit artifacts/coverage
          if [ ! -f artifacts/junit/stage1-unit.xml ]; then
            printf '%s\n' '<testsuite name="stage1-unit" tests="0" failures="0" errors="0" skipped="0"></testsuite>' > artifacts/junit/stage1-unit.xml
          fi
          if [ -f coverage.xml ] && [ ! -f artifacts/coverage/stage1-coverage.xml ]; then
            cp coverage.xml artifacts/coverage/stage1-coverage.xml
          fi
          if [ ! -f artifacts/coverage/stage1-coverage.xml ]; then
            cat <<'EOF' > artifacts/coverage/stage1-coverage.xml
<?xml version="1.0" ?>
<coverage version="7.0" timestamp="0" lines-valid="0" lines-covered="0" line-rate="0" branches-covered="0" branches-valid="0" branch-rate="0" complexity="0">
  <sources>
    <source>.</source>
  </sources>
  <packages/>
</coverage>
EOF
          fi

      - name: Upload Stage 1 test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-test-artifacts-${{ github.run_id }}
          path: |
            artifacts/junit/stage1-unit.xml
            artifacts/coverage/stage1-coverage.xml
          if-no-files-found: error

  stage-2-integration-endpoints:
    name: Stage 2 - Integration and endpoint tests
    runs-on: ubuntu-latest
    needs: stage-1-fast-feedback
    env:
      DATABASE_URL: postgresql+psycopg2://society_user:society_pass@localhost:5432/society_db
      REDIS_URL: redis://localhost:6379/0
      QUEUE_URL: amqp://guest:guest@localhost:5672/
      OBJECT_STORE_ENDPOINT: http://localhost:9000
      OBJECT_STORE_ACCESS_KEY: minioadmin
      OBJECT_STORE_SECRET_KEY: minioadmin
      OBJECT_STORE_BUCKET: society-agent-ci
    steps:
      - uses: actions/checkout@v4

      - name: Start containerized test dependencies
        run: docker compose -f ci/docker-compose.test-deps.yml -p pr-${{ github.run_id }} up -d

      - name: Wait for dependency health checks
        run: |
          set -euo pipefail
          mkdir -p artifacts/logs
          COMPOSE_ARGS="-f ci/docker-compose.test-deps.yml -p pr-${{ github.run_id }}"
          SERVICES=(postgres redis rabbitmq minio)
          TIMEOUT_SECONDS=180
          POLL_SECONDS=5
          START_TIME=$(date +%s)

          while true; do
            echo "Current dependency status:"
            docker compose ${COMPOSE_ARGS} ps || true

            all_healthy=true
            for service in "${SERVICES[@]}"; do
              container_id=$(docker compose ${COMPOSE_ARGS} ps -q "${service}")
              if [ -z "${container_id}" ]; then
                echo "Service ${service} is not running."
                all_healthy=false
                continue
              fi

              health_status=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "${container_id}" 2>/dev/null || echo "unknown")
              echo "${service}: ${health_status}"
              if [ "${health_status}" != "healthy" ]; then
                all_healthy=false
              fi
            done

            if [ "${all_healthy}" = true ]; then
              echo "All dependencies are healthy."
              break
            fi

            elapsed=$(( $(date +%s) - START_TIME ))
            if [ "${elapsed}" -ge "${TIMEOUT_SECONDS}" ]; then
              echo "Timed out waiting for dependencies to become healthy after ${TIMEOUT_SECONDS}s."
              docker compose ${COMPOSE_ARGS} ps | tee artifacts/logs/dependency-health-ps.txt
              for service in "${SERVICES[@]}"; do
                container_id=$(docker compose ${COMPOSE_ARGS} ps -q "${service}")
                if [ -n "${container_id}" ]; then
                  docker inspect "${container_id}" > "artifacts/logs/dependency-health-${service}.json"
                fi
              done
              docker compose ${COMPOSE_ARGS} logs --no-color > artifacts/logs/dependency-services.log
              exit 1
            fi

            sleep "${POLL_SECONDS}"
          done

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and test impact tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-rerunfailures
          pip install pytest-testmon || echo "pytest-testmon install failed; using pytest fallback mode"

      - name: Restore test impact cache (.testmondata)
        uses: actions/cache@v4
        with:
          path: .testmondata
          key: testmon-stage2-${{ github.base_ref || github.ref_name }}-${{ hashFiles('requirements.txt', 'pytest.ini') }}
          restore-keys: |
            testmon-stage2-${{ github.base_ref || github.ref_name }}-

      - name: Reset and seed deterministic DB state
        run: python scripts/ci/reset_test_state.py

      - name: Run integration + endpoint tests (impact selected)
        run: |
          TESTMON_ARGS=""
          if pytest --help | grep -q -- "--testmon"; then
            TESTMON_ARGS="--testmon"
          else
            echo "pytest-testmon not available; running full integration/endpoint selection"
          fi

          RERUN_ARGS=""
          if pytest --help | grep -q -- "--reruns"; then
            RERUN_ARGS="--reruns 1"
          else
            echo "pytest-rerunfailures not available; running without reruns"
          fi

          pytest ${TESTMON_ARGS} ${RERUN_ARGS} -q -m "integration or endpoint" --junitxml=artifacts/junit/stage2-integration-endpoint.xml

      - name: Ensure Stage 2 JUnit artifact exists
        if: always()
        run: |
          mkdir -p artifacts/junit
          if [ ! -f artifacts/junit/stage2-integration-endpoint.xml ]; then
            printf '%s\n' '<testsuite name="stage2-integration-endpoint" tests="0" failures="0" errors="0" skipped="0"></testsuite>' > artifacts/junit/stage2-integration-endpoint.xml
          fi

      - name: Collect dependency logs on failure
        if: failure()
        run: |
          mkdir -p artifacts/logs
          docker compose -f ci/docker-compose.test-deps.yml -p pr-${{ github.run_id }} logs --no-color > artifacts/logs/dependency-services.log
          docker compose -f ci/docker-compose.test-deps.yml -p pr-${{ github.run_id }} ps > artifacts/logs/dependency-health-ps.txt
          for service in postgres redis rabbitmq minio; do
            container_id=$(docker compose -f ci/docker-compose.test-deps.yml -p pr-${{ github.run_id }} ps -q "${service}")
            if [ -n "${container_id}" ]; then
              docker inspect "${container_id}" > "artifacts/logs/dependency-health-${service}.json"
            fi
          done

      - name: Upload Stage 2 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage2-artifacts-${{ github.run_id }}
          path: |
            artifacts/junit/stage2-integration-endpoint.xml
            artifacts/logs/

      - name: Teardown ephemeral dependencies
        if: always()
        run: docker compose -f ci/docker-compose.test-deps.yml -p pr-${{ github.run_id }} down -v

  stage-3-critical-smoke:
    name: Stage 3 - Critical E2E smoke (always on PR)
    runs-on: ubuntu-latest
    needs: stage-2-integration-endpoints
    env:
      DATABASE_URL: postgresql+psycopg2://society_user:society_pass@localhost:5432/society_db
      REDIS_URL: redis://localhost:6379/0
      QUEUE_URL: amqp://guest:guest@localhost:5672/
      OBJECT_STORE_ENDPOINT: http://localhost:9000
      OBJECT_STORE_ACCESS_KEY: minioadmin
      OBJECT_STORE_SECRET_KEY: minioadmin
      OBJECT_STORE_BUCKET: society-agent-ci
    steps:
      - uses: actions/checkout@v4

      - name: Start containerized test dependencies
        run: docker compose -f ci/docker-compose.test-deps.yml -p smoke-${{ github.run_id }} up -d

      - name: Wait for dependency health checks
        run: |
          set -euo pipefail
          mkdir -p artifacts/logs
          COMPOSE_ARGS="-f ci/docker-compose.test-deps.yml -p smoke-${{ github.run_id }}"
          SERVICES=(postgres redis rabbitmq minio)
          TIMEOUT_SECONDS=180
          POLL_SECONDS=5
          START_TIME=$(date +%s)

          while true; do
            echo "Current dependency status:"
            docker compose ${COMPOSE_ARGS} ps || true

            all_healthy=true
            for service in "${SERVICES[@]}"; do
              container_id=$(docker compose ${COMPOSE_ARGS} ps -q "${service}")
              if [ -z "${container_id}" ]; then
                echo "Service ${service} is not running."
                all_healthy=false
                continue
              fi

              health_status=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "${container_id}" 2>/dev/null || echo "unknown")
              echo "${service}: ${health_status}"
              if [ "${health_status}" != "healthy" ]; then
                all_healthy=false
              fi
            done

            if [ "${all_healthy}" = true ]; then
              echo "All dependencies are healthy."
              break
            fi

            elapsed=$(( $(date +%s) - START_TIME ))
            if [ "${elapsed}" -ge "${TIMEOUT_SECONDS}" ]; then
              echo "Timed out waiting for dependencies to become healthy after ${TIMEOUT_SECONDS}s."
              docker compose ${COMPOSE_ARGS} ps | tee artifacts/logs/dependency-health-ps.txt
              for service in "${SERVICES[@]}"; do
                container_id=$(docker compose ${COMPOSE_ARGS} ps -q "${service}")
                if [ -n "${container_id}" ]; then
                  docker inspect "${container_id}" > "artifacts/logs/dependency-health-${service}.json"
                fi
              done
              docker compose ${COMPOSE_ARGS} logs --no-color > artifacts/logs/dependency-services.log
              exit 1
            fi

            sleep "${POLL_SECONDS}"
          done

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-rerunfailures

      - name: Reset and seed deterministic DB state
        run: python scripts/ci/reset_test_state.py

      - name: Run critical smoke tests (always)
        run: pytest --reruns 1 -m smoke -q --junitxml=artifacts/junit/stage3-smoke.xml

      - name: Ensure Stage 3 JUnit artifact exists
        if: always()
        run: |
          mkdir -p artifacts/junit
          if [ ! -f artifacts/junit/stage3-smoke.xml ]; then
            printf '%s\n' '<testsuite name="stage3-smoke" tests="0" failures="0" errors="0" skipped="0"></testsuite>' > artifacts/junit/stage3-smoke.xml
          fi

      - name: Collect dependency logs on failure
        if: failure()
        run: |
          mkdir -p artifacts/logs
          docker compose -f ci/docker-compose.test-deps.yml -p smoke-${{ github.run_id }} logs --no-color > artifacts/logs/dependency-services.log
          docker compose -f ci/docker-compose.test-deps.yml -p smoke-${{ github.run_id }} ps > artifacts/logs/dependency-health-ps.txt
          for service in postgres redis rabbitmq minio; do
            container_id=$(docker compose -f ci/docker-compose.test-deps.yml -p smoke-${{ github.run_id }} ps -q "${service}")
            if [ -n "${container_id}" ]; then
              docker inspect "${container_id}" > "artifacts/logs/dependency-health-${service}.json"
            fi
          done

      - name: Upload Stage 3 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3-artifacts-${{ github.run_id }}
          path: |
            artifacts/junit/stage3-smoke.xml
            artifacts/logs/

      - name: Teardown ephemeral dependencies
        if: always()
        run: docker compose -f ci/docker-compose.test-deps.yml -p smoke-${{ github.run_id }} down -v

  aggregate-reliability-dashboard:
    name: Aggregate reliability dashboard
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
      issues: write
      pull-requests: write
    needs:
      - stage-1-fast-feedback
      - stage-2-integration-endpoints
      - stage-3-critical-smoke
    env:
      STAGE1_FLAKY_THRESHOLD: 0
      STAGE1_ERROR_THRESHOLD: 0
      STAGE2_FLAKY_THRESHOLD: 1
      STAGE2_ERROR_THRESHOLD: 0
      STAGE3_FLAKY_THRESHOLD: 0
      STAGE3_ERROR_THRESHOLD: 0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download Stage 1 JUnit artifact
        uses: actions/download-artifact@v4
        with:
          name: stage1-test-artifacts-${{ github.run_id }}
          path: artifacts/from-jobs/stage1

      - name: Download Stage 2 artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: stage2-artifacts-${{ github.run_id }}
          path: artifacts/from-jobs/stage2

      - name: Download Stage 3 artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: stage3-artifacts-${{ github.run_id }}
          path: artifacts/from-jobs/stage3


      - name: Ensure fallback Stage 2/3 JUnit files exist
        run: |
          mkdir -p artifacts/from-jobs/stage2/artifacts/junit
          mkdir -p artifacts/from-jobs/stage3/artifacts/junit

          if [ ! -f artifacts/from-jobs/stage2/artifacts/junit/stage2-integration-endpoint.xml ]; then
            printf '%s\n' '<testsuite name="stage2-integration-endpoint" tests="0" failures="0" errors="0" skipped="1"><testcase classname="pipeline" name="stage2_artifact_missing"><skipped message="stage2 artifact missing">stage2 artifact missing</skipped></testcase></testsuite>' > artifacts/from-jobs/stage2/artifacts/junit/stage2-integration-endpoint.xml
          fi

          if [ ! -f artifacts/from-jobs/stage3/artifacts/junit/stage3-smoke.xml ]; then
            printf '%s\n' '<testsuite name="stage3-smoke" tests="0" failures="0" errors="0" skipped="1"><testcase classname="pipeline" name="stage3_artifact_missing"><skipped message="stage3 artifact missing">stage3 artifact missing</skipped></testcase></testsuite>' > artifacts/from-jobs/stage3/artifacts/junit/stage3-smoke.xml
          fi

      - name: Build merged reliability dashboard
        run: |
          python scripts/ci/reliability_dashboard.py \
            --junit \
              artifacts/from-jobs/stage1/stage1-unit.xml \
              artifacts/from-jobs/stage2/artifacts/junit/stage2-integration-endpoint.xml \
              artifacts/from-jobs/stage3/artifacts/junit/stage3-smoke.xml \
            --output-json artifacts/reliability/dashboard.json \
            --output-md artifacts/reliability/dashboard.md \
            --flaky-threshold 9999

      - name: Enforce per-tier flaky and error thresholds
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          dashboard = json.loads(Path("artifacts/reliability/dashboard.json").read_text(encoding="utf-8"))
          suites = {Path(s["file"]).name: s for s in dashboard["suites"]}

          checks = [
              ("stage1-unit.xml", "Stage 1", int(os.environ["STAGE1_FLAKY_THRESHOLD"]), int(os.environ["STAGE1_ERROR_THRESHOLD"])),
              ("stage2-integration-endpoint.xml", "Stage 2", int(os.environ["STAGE2_FLAKY_THRESHOLD"]), int(os.environ["STAGE2_ERROR_THRESHOLD"])),
              ("stage3-smoke.xml", "Stage 3", int(os.environ["STAGE3_FLAKY_THRESHOLD"]), int(os.environ["STAGE3_ERROR_THRESHOLD"])),
          ]

          failures = []
          lines = ["## Tier reliability threshold checks", "", "| Tier | Failed+Error tests | Error threshold | Flaky tests | Flaky threshold | Status |", "| --- | ---: | ---: | ---: | ---: | --- |"]
          for suite_name, tier, flaky_threshold, error_threshold in checks:
              summary = suites.get(suite_name, {"failed": 0, "flaky_tests": []})
              failed = int(summary.get("failed", 0))
              flaky = len(summary.get("flaky_tests", []))
              ok = failed <= error_threshold and flaky <= flaky_threshold
              status = "✅ Pass" if ok else "❌ Fail"
              if not ok:
                  failures.append(
                      f"{tier} exceeded threshold(s): failed={failed} (max {error_threshold}), flaky={flaky} (max {flaky_threshold})."
                  )
              lines.append(f"| {tier} | {failed} | {error_threshold} | {flaky} | {flaky_threshold} | {status} |")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write(Path("artifacts/reliability/dashboard.md").read_text(encoding="utf-8"))
              fh.write("\n")
              fh.write("\n".join(lines) + "\n")

          Path("artifacts/reliability/threshold-summary.md").write_text("\n".join(lines) + "\n", encoding="utf-8")

          if failures:
              raise SystemExit("\n".join(failures))
          PY

      - name: Upload merged reliability artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reliability-dashboard-pr-${{ github.run_id }}
          path: artifacts/reliability/

      - name: Comment merged reliability dashboard on PR
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const dashboardPath = 'artifacts/reliability/dashboard.md';
            const thresholdsPath = 'artifacts/reliability/threshold-summary.md';
            const dashboard = fs.existsSync(dashboardPath)
              ? fs.readFileSync(dashboardPath, 'utf8')
              : '> ⚠️ Reliability dashboard could not be generated in this run.';
            const thresholds = fs.existsSync(thresholdsPath)
              ? fs.readFileSync(thresholdsPath, 'utf8')
              : '> ⚠️ Tier threshold summary is unavailable because prior reliability steps did not produce artifacts.';
            const body = [
              '<!-- pr-reliability-dashboard -->',
              '# PR Reliability Dashboard',
              '',
              dashboard,
              '',
              thresholds,
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const marker = '<!-- pr-reliability-dashboard -->';
            const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.includes(marker));

            try {
              if (existing) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number,
                  body,
                });
              }
            } catch (error) {
              const message = String(error?.message || 'unknown error');
              const status = Number(error?.status || 0);
              if (status === 403 || message.includes('Resource not accessible by integration')) {
                core.warning('Skipping PR comment: token cannot write issue comments in this context.');
                return;
              }
              throw error;
            }
