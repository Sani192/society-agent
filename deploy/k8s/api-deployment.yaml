apiVersion: apps/v1
kind: Deployment
metadata:
  name: society-agent-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: society-agent-api
  template:
    metadata:
      labels:
        app: society-agent-api
    spec:
      containers:
        - name: api
          image: society-agent:latest
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
